<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Филип & Јелена — 02.05.2026.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Pinyon+Script&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #fdfcf8 0%, #f7f5ef 30%, #f4f2ea 60%, #f7f5ef 100%);
      font-family: 'Cormorant Garamond', serif;
      position: relative;
      overflow-x: hidden;
    }

    .floral-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 220px;
      pointer-events: none;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding-top: clamp(3rem, 8vw, 5rem);
      padding-bottom: 2rem;
    }

    .save-the-date {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(2rem, 5vw, 3rem);
      color: #b8a44c;
      margin-bottom: 0.5rem;
    }

    .gold-line {
      width: 4px;
      height: 40px;
      background: linear-gradient(180deg, #b8a44c, transparent);
      margin: 0 auto 1.5rem;
    }

    .date-display {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .date-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 700;
      color: #4a5c3a;
      line-height: 1;
    }

    .date-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      color: #4a5c3a;
      font-weight: 700;
      text-align: left;
    }

    /* HEXAGONAL PHOTO */
    .hex-container {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
    }

    .hex-wrapper {
      position: relative;
      width: clamp(200px, 45vw, 280px);
      height: clamp(220px, 50vw, 310px);
    }

    .hex-border {
      position: absolute;
      inset: 0;
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      background: linear-gradient(135deg, #b8a44c, #d4c87a, #b8a44c);
    }

    .hex-photo {
      position: absolute;
      inset: 4px;
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      overflow: hidden;
    }

    .hex-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* NAMES */
    .names {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.5rem, 7vw, 4rem);
      color: #4a5c3a;
      font-weight: 400;
      margin: 1.5rem 0 0.5rem;
    }

    .surname {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: #999;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    /* DIVIDER */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
    }

    .divider-line-left {
      flex: 1;
      max-width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #b8a44c);
    }

    .divider-line-right {
      flex: 1;
      max-width: 100px;
      height: 1px;
      background: linear-gradient(90deg, #b8a44c, transparent);
    }

    .divider-heart {
      color: #b8a44c;
      font-size: 1.2rem;
    }

    /* COUNTDOWN */
    .countdown-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: #4a5c3a;
      font-style: italic;
      font-weight: 400;
      text-align: center;
      margin-bottom: 2rem;
    }

    .countdown-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .countdown-item {
      text-align: center;
      min-width: 80px;
    }

    .countdown-value {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #4a5c3a;
      font-weight: 700;
      line-height: 1;
    }

    .countdown-label {
      border-top: 2px solid #b8a44c;
      margin-top: 8px;
      padding-top: 8px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: #6b7c5a;
      letter-spacing: 0.1em;
    }

    /* INVITE TEXT */
    .invite-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      color: #555;
      line-height: 1.8;
      font-style: italic;
      max-width: 550px;
      margin: 0 auto;
      text-align: center;
    }

    /* EVENT CARDS */
    .events-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2.5rem;
      justify-content: center;
      padding: 2.5rem 0;
    }

    .event-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 30px rgba(74,92,58,0.08);
      border: 1px solid rgba(184,164,76,0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .event-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 40px rgba(74,92,58,0.12);
    }

    .event-icon { margin-bottom: 1.5rem; display: flex; justify-content: center; }
    .event-icon svg { width: 90px; height: 90px; }
    .event-icon img { width: 110px; height: 110px; object-fit: contain; }

    .event-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem;
      color: #4a5c3a;
      font-style: italic;
      font-weight: 600;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .event-location {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      color: #555;
      font-weight: 600;
      margin: 0.4rem 0;
    }

    .event-address {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      color: #777;
      margin: 0.3rem 0;
    }

    .event-map-link {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: #4a5c3a;
      margin-top: 0.6rem;
      text-decoration: none;
      border-bottom: 1px solid #4a5c3a;
      padding-bottom: 2px;
      transition: color 0.2s;
    }

    .event-map-link:hover { color: #3a4c2a; }

    .event-time {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: #b8a44c;
      font-style: italic;
      margin-top: 1.2rem;
    }

    /* RSVP */
    .rsvp-section {
      padding: 2rem 0 3rem;
      text-align: center;
    }

    .rsvp-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: #4a5c3a;
      font-style: italic;
      font-weight: 400;
      margin-bottom: 1rem;
    }

    .rsvp-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: #555;
      font-style: italic;
      margin-bottom: 0.5rem;
    }

    .rsvp-deadline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: #888;
      margin-bottom: 2rem;
    }

    .rsvp-box {
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: clamp(2rem, 5vw, 3rem);
      border: 1px solid rgba(184,164,76,0.15);
      box-shadow: 0 4px 30px rgba(74,92,58,0.06);
    }

    .rsvp-btn {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      background: #6b7c5a;
      border: none;
      border-radius: 30px;
      padding: 16px 56px;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(74,92,58,0.25);
    }

    .rsvp-btn:hover {
      background: #5a6b4a;
      box-shadow: 0 6px 25px rgba(74,92,58,0.35);
      transform: translateY(-2px);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 2rem 0 3rem;
      opacity: 0.5;
    }

    footer p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      color: #999;
    }

    /* Decorative floral element */
    .floral-divider {
      text-align: center;
      margin: 2rem 0;
      opacity: 0.3;
    }
  </style>
</head>

    function updateCountdown() {
      const now = new Date();
      const diff = WEDDING - now;
      if (diff <= 0) return;
      const d = Math.floor(diff / (1000*60*60*24));
      const h = Math.floor((diff / (1000*60*60)) % 24);
      const m = Math.floor((diff / (1000*60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      const items = [
        { val: d, label: 'дана' },
        { val: h, label: 'сати' },
        { val: m, label: 'минута' },
        { val: s, label: 'секунди' },
      ];

      document.getElementById('countdown').innerHTML = items.map(i => `
        <div class="countdown-item">
          <div class="countdown-value">${i.val}</div>
          <div class="countdown-label">${i.label}</div>
        </div>
      `).join('');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    function updateDeadline() {

        <a class="event-map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.map)}" target="_blank">Погледај на мапи</a>
        <div class="event-time">${e.time}</div>
      </div>
    `).join('');
  </script>

</body>
</html>
